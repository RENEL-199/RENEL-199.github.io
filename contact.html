<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact &middot; Pixel Portfolio</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Pixel Font -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/contact.css">
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top custom-nav px-3">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center gap-2 text-white" href="index.html">
        <img src="Uploads/Charactersmol.gif" class="brand-sprite" alt="">
        <span>Renly</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav text-center text-lg-end gap-1 gap-lg-2">
          <li class="nav-item"><a class="nav-link text-white" href="index.html">Welcome Page</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="gallery.html">Gallery</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="about.html">About me</a></li>
          <li class="nav-item"><a class="nav-link text-white active" aria-current="page" href="contact.html">Contact me</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="container py-5">

    <header class="text-center mb-5">
      <h1 class="pixel-title text-white mb-3">Let's <span>Connect</span></h1>
      <p class="subtitle mx-auto">
        Got a project, a question, or just want to say hi? Drop me a message and I'll get back to you.
      </p>
    </header>

    <div class="row g-4 justify-content-center align-items-stretch">

      <!-- CONTACT INFO -->
      <div class="col-12 col-lg-5">
        <div class="contact-card h-100 p-4 p-md-5">
          <h2 class="card-heading mb-4">Reach me</h2>

          <a class="contact-row d-flex align-items-center gap-3 mb-3 text-decoration-none"
             href="mailto:samrenlyc@gmail.com">
            <span class="contact-icon">@</span>
            <span class="contact-text">samrenlyc@gmail.com</span>
          </a>

          <a class="contact-row d-flex align-items-center gap-3 mb-3 text-decoration-none"
             href="https://github.com/RENEL-199" target="_blank" rel="noopener">
            <span class="contact-icon">GH</span>
            <span class="contact-text">github.com/RENEL-199</span>
          </a>

          <div class="contact-row d-flex align-items-center gap-3">
            <span class="contact-icon">PH</span>
            <span class="contact-text">Manila, Philippines</span>
          </div>

          <div class="mt-5 text-center">
            <img src="Uploads/Character.gif" class="img-fluid mascot" alt="Pixel mascot">
          </div>
        </div>
      </div>

      <!-- CONTACT FORM -->
      <div class="col-12 col-lg-7">
        <div class="contact-card h-100 p-4 p-md-5">
          <h2 class="card-heading mb-4">Send a message</h2>

          <form id="contactForm" novalidate>
            <div class="row g-3">
              <div class="col-12 col-md-6">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control pixel-input" id="name" name="name" placeholder="Your name" required>
              </div>

              <div class="col-12 col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control pixel-input" id="email" name="email" placeholder="you@email.com" required>
              </div>

              <div class="col-12">
                <label for="subject" class="form-label">Subject</label>
                <input type="text" class="form-control pixel-input" id="subject" name="subject" placeholder="What's this about?">
              </div>

              <div class="col-12">
                <label for="message" class="form-label">Message</label>
                <textarea class="form-control pixel-input" id="message" name="message" rows="5" placeholder="Type your message..." required></textarea>
              </div>

              <div class="col-12 d-grid d-sm-block">
                <button type="submit" class="btn pixel-btn">Send Message</button>
              </div>
            </div>
          </form>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.getElementById("contactForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const name = encodeURIComponent(document.getElementById("name").value.trim());
      const email = encodeURIComponent(document.getElementById("email").value.trim());
      const subject = document.getElementById("subject").value.trim() || "Hello from your portfolio";
      const message = document.getElementById("message").value.trim();
      const body = encodeURIComponent(message + "\n\nFrom: " + decodeURIComponent(name) + " (" + decodeURIComponent(email) + ")");
      window.location.href = "mailto:samrenlyc@gmail.com?subject=" + encodeURIComponent(subject) + "&body=" + body;
    });
  </script>

</body>

</html>
